# Render Blueprint: Dashboard → New → Blueprint → pick this repo → Apply.
# Free plan: sleeps after 15 min idle and has no persistent disk, so the
# demo data is recreated (fresh dummy data) whenever the service restarts.
services:
  - type: web
    name: qinga
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      # Behind Render's proxy: lets the app know its public https address (cookies, brief links).
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto
      - key: HOST_HEADER
        value: x-forwarded-host
      # Password for the demo team accounts — Render asks for it when you apply the Blueprint.
      - key: DEMO_PASSWORD
        sync: false
      # Optional: real SMS via Africa's Talking (leave unset to keep the built-in simulator).
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
